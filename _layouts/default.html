<!doctype html>
<html lang="{{ site.locale | default: 'en-AU' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f3f6f0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include site-nav.html %}
  <main id="main-content" class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>Jordy Williams <span aria-hidden="true">/</span> Melbourne, Australia</p>
      <div class="site-footer__links">
        <a href="mailto:{{ site.email }}">Email</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/{{ site.github-url }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
      <p class="site-footer__fine">© {{ 'now' | date: '%Y' }} Jordy Williams</p>
    </div>
  </footer>
</body>
</html>
